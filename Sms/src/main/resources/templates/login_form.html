<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" th:href="@{/header.css}">
<style>
:root {
	--primary: #6366f1;
	--secondary: #8b5cf6;
	--accent: #ec4899;
	--bg: #f8fafc;
	--text: #1e293b;
}

/* BODY */
body {
	margin: 0;
	padding: 0;
	font-family: 'Poppins', sans-serif;
	height: 100vh;
}

/* CONTAINER */
.container {
	width: 22rem;
	margin: 60px auto;
}

/* CARD */
.subcont {
	backdrop-filter: blur(15px);
	background: linear-gradient(135deg, var(--primary), var(--secondary));
	border-radius: 20px;
	padding: 25px;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
	border: 1px solid rgba(255, 255, 255, 0.2);
	color: white;
}

/* LOGO */
.imgcont {
	text-align: center;
}

.imgcont h1 {
	font-size: 28px;
	margin-bottom: 10px;
}

/* HEADING */
.headingh3 {
	text-align: center;
	margin-bottom: 20px;
}

/* INPUT SECTION */
.inpcredential {
	margin: 0 10px;
}

.inpcredential p {
	margin: 10px 0 5px;
	font-size: 14px;
}

/* INPUT */
.nametype {
	width: 100%;
	padding: 10px;
	border-radius: 10px;
	border: none;
	outline: none;
	background: rgba(255, 255, 255, 0.2);
	color: white;
}

.nametype::placeholder {
	color: #e2e8f0;
}

/* PASSWORD DOTS */
input[type="password"] {
	-webkit-text-security: disc;
}

/* FORGOT PASSWORD */
.forgetpassword {
	text-align: right;
	margin-top: 10px;
}

.forgetpassword a {
	color: rgb(128, 0, 0);
	text-decoration: none;
}

.forgetpassword a:hover {
	color: #fff;
}

/* BUTTON */
.button {
	margin-top: 20px;
}

.button button {
	width: 100%;
	padding: 12px;
	border-radius: 25px;
	border: none;
	font-weight: 600;
	cursor: pointer;
	background: linear-gradient(135deg, #1e3c72, #2a5298);
	color: white;
	transition: 0.3s;
}

.button button:hover {
	transform: translateY(-2px);
	box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
}

/* SOCIAL */
.mediaopt {
	text-align: center;
	margin-top: 25px;
	
}

.mideaimg a{
	cursor: pointer;
	transition: 0.3s;
	
}
.mideaimg a i{
	margin: 5px 12px;
}

.mideaimg a:hover {
	transform: scale(1.2);
}

/* RESPONSIVE */
@media ( max-width :500px) {
	.container {
		width: 90%;
	}
}
</style>
</head>
<body>

	<div th:replace="~{navbar::backnav}"></div>

	<form th:action="@{/login}" class="container" method="post">
		<div class="subcont">
			<div class="imgcont">
				<h1>SmS</h1>
			</div>
			<div class="headingh3">
				<h2>Login Form</h2>
			</div>
			<div class="inpcredential">
				<p>Username :</p>
				<input class="nametype" name="username" type="email"
					placeholder="Enter your username here" required>

				<p>Password :</p>
				<input type="password" name="password" class="nametype"
					id="filltype" placeholder="Enter your password here" required>
			</div>
			<div class="forgetpassword">
				<a href="/forgot-password">forgot password</a>
			</div>
			<div class="button">
				<button id="submittbut">Login</button>
			</div>
			<div class="mediaopt">
				<p>Or continue with</p>
				

<div class="mideaimg">
    <a href="#"><i class="fa-brands fa-apple"></i></a>
    <a href="#"><i class="fa-brands fa-google"></i></a>
    <a href="#"><i class="fa-brands fa-facebook"></i></a>
</div>
			</div>
		</div>
	</form>
	
	
</body>
</html>
