<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/super_admin_css/header.css}">
    <title>SmS Super Admin</title>
    <style>
        .register-section{
			display:flex;
			justify-content:center;
			align-items:center;
			padding:50px 20px;
		}
		
		.register-card{
			background:white;
			padding:35px;
			border-radius:15px;
			width:350px;
			box-shadow:0 5px 15px rgba(0,0,0,0.2);
			text-align:center;
		}
		
		.register-card h2{
			margin-bottom:20px;
			color:#ff758c;
		}
		
		.input-group{
			text-align:left;
			margin-bottom:15px;
		}
		
		.input-group label{
			font-weight:bold;
			font-size:14px;
		}
		
		.input-group input,
		.input-group select{
			width:100%;
			padding:10px;
			margin-top:5px;
			border-radius:8px;
			border:1px solid #ccc;
		}
		
		.register-card button{
			width:100%;
			padding:12px;
			border:none;
			border-radius:20px;
			background:#ffcc00;
			font-weight:bold;
			cursor:pointer;
			margin-top:10px;
		}
		
		.register-card button:hover{
			background:#ffaa00;
		}
		
		.login-link{
			margin-top:15px;
			font-size:14px;
		}
		
		.login-link a{
			color:#ff758c;
			text-decoration:none;
		}
    </style>
</head>
<body>

	<div th:replace="~{/super_admin_html/navbar::super_navbar}"></div>
	
    <section class="register-section">

		<div class="register-card">
		
			<h2>Create School Admin</h2>
		
			<form th:action="@{/super/user_register}" method="post" th:object="${user}">
			
				<div class="input-group">
					<label>Full Name</label>
					<input type="text" name="name" th:field="*{name}" placeholder="Enter your name" required>
				</div>
			
				<div class="input-group">
					<label>Email</label>
					<input type="email" name="email" th:field="*{email}" placeholder="Enter your email" required>
				</div>
				
				<div class="input-group">
					<label>Phone</label>
					<input type="text" name="phone" th:field="*{phone}" placeholder="Enter phone number" required>
				</div>
			
				<div class="input-group">
					<label>Role</label>
					<select name="role">
						<option >Select role</option>
						<option value="ROLE_SCHOOL_ADMIN">School Admin</option>
						<option value="ROLE_TEACHER">Teacher</option>
						<option value="ROLE_STUDENT">Student</option>
						<option value="ROLE_RECEPTIONIST">Receptionist</option>
						<option value="ROLE_LIBRARIAN">Librarian</option>
						<option value="ROLE_ACCOUNTANT">Accountant</option>
						<option value="ROLE_PARENT">Parent</option>
					</select>
				</div>
				
				<div class="input-group">
					<label>School</label>
					<select name="sch">
						<option >Select School</option>
						<option th:each="school : ${schools}" th:text="${school.name}" th:value = "${school.name}">School Admin</option>
						
					</select>
				</div>
			
				<div class="input-group">
					<label>Password</label>
					<input type="password" name="password" th:field="*{password}" placeholder="Create password" required>
				</div>
				
				<button type="submit">Register</button>
			
			</form>
		
		</div>
		
	</section>
</body>
</html>
