<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SmS Super Admin</title>
    <link rel="stylesheet" th:href="@{/super_admin_css/header.css}">
	<style>
		
		.school-list{
			padding:40px;
			text-align:center;
		}
			
		.school-list h2{
			color:#ff758c;
			margin-bottom:20px;
		}
			
		table{
			width:90%;
			margin:auto;
			border-collapse:collapse;
			background:white;
			border-radius:10px;
			overflow:hidden;
			box-shadow:0 5px 10px rgba(0,0,0,0.2);
		}
			
		th,td{
			padding:12px;
			border-bottom:1px solid #ddd;
		}
			
		th{
			background:#ff7eb3;
			color:white;
		}
			
		tr:hover{
			background:#f5f5f5;
		}
			
		.ancer{
			padding:6px 12px;
			border-radius:15px;
			text-decoration:none;
			font-size:14px;
			margin:2px;
		}
			
		.view{
			background:#4ecdc4;
			color:white;
		}
			
		.edit{
			background:#ffcc00;
			color:black;
		}
			
		.delete{
			background:#ff6b6b;
			color:white;
		}
	
	</style>
</head>
<body>

	<!-- navbar -->
    <nav class="navbar">

        <div class="logo">SmS</div>
        <!-- Navigation Links -->
        <div class="nav-buttons" id="nav-links">
            <div class="auth-links">
                <a th:href="@{/super}" class="btn">Back</a>
            </div>
        </div>
    </nav>
	
	
	<section class="school-list">
	
		<h2>All Registered Schools</h2>
		
		<table>
		
			<thead>
				<tr>
					<th>ID</th>
					<th>School Name</th>
					<th>Email</th>
					<th>Phone</th>
					<th>City</th>
					<th>Actions</th>
				</tr>
			</thead>
			
			<tbody>
			
				<tr th:each="school : ${schools}">
				
					<td th:text="${school.id}"></td>
					<td th:text="${school.Name}"></td>
					<td th:text="${school.email}"></td>
					<td th:text="${school.phone}"></td>
					<td th:text="${school.city}"></td>
				
					<td>
						<a th:href="@{/super/view-school-detail/{id}(id=${school.id})}" class="ancer view">View</a>
						<a th:href="@{/super-admin/edit-school/{id}(id=${school.id})}" class="ancer edit">Edit</a>
						<a th:href="@{/super-admin/delete-school/{id}(id=${school.id})}" class="ancer delete">Delete</a>
					</td>
				
				</tr>
			
			</tbody>
		
		</table>
	
	</section>
	
</body>
</html>
