<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" th:href="@{/navbar.css}">
<style>
	body{
	    margin: 0;
	    padding: 0;
	    background:#fdf6e3;
	}
	.container{
	    width: 20rem;
	    height: 33rem;
	    margin: 50px auto;
	}
	.subcont{
	    border: 2px solid rgb(75, 184, 252);
	    height: 100%;
	    width: 100%;
	    border-radius: 20px;
	    box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
	    background-color: rgb(255, 184, 113);
	}
	
	.imgcont{
	    margin: 20px 0px 0px 20px;
	    height: 70px;
	    width: 70px;
	}
	.imgcont img{
	    width: 100%;
	    text-align: center;
	}
	.headingh3{
	    text-align: center;
	    /* border: 2px solid red; */
	    height: 20px;
	}
	.inpcredential{
	    /* border: 2px solid red; */
	    margin:0px 20px;
	}
	.inpcredential p{
	    margin-bottom: 0px;
	    font-style: normal;
	    font-size: 17px;
	    /* border: 2px solid red; */
	}
	.nametype{
	    background: #FFFFFF;
	    border: 1px solid #9d9d9d;
	    border-radius: 9px;
	    padding: 10px;
	    width: 90%;
	    line-height: 21px;
	    /* outline: none; */
	}
	 input[type = "password"]{
	    -webkit-text-security:"*";
	 }
	.forgetpassword{
	    margin: 50px 20px 5px 0px;
	    text-align: end;
	    
	}
	.forgetpassword a{
	    text-decoration: none;
	}
	.forgetpassword a:hover,.mideaimg a:hover{
	    color: red;
	}
	.button{
	    width: 90%;
	    margin: auto;
	}
	.button button{
	    width: 100%;
	    height: 45px;
	    border: 0px;
	    background: #d4e7ff;
	    box-shadow: 0px 4px 19px rgba(119, 147, 65, 0.3);
	    border-radius: 10px;
	    color: rgb(0, 0, 0);
	    cursor: pointer;
	    font-size: large;
	    font-weight: 700;
	    /* border: 2px solid red; */
	}
	.button :hover{
	    transition: 300ms;
	    color: rgb(121, 14, 14);
	    background-color: rgb(49, 101, 255);
	}
	.mediaopt{
	    /* border: 2px solid red; */
	    width: 90%;
	    margin: auto;
	    margin-top: 40px;
	}
	.mideaimg{
	    align-items: center;
	    text-align: center;
	    margin-top: -13px;
	    /* border: 2px solid red; */
	
	}
	.mideaimg img{
	    /* border: 2px solid red; */
	    cursor: pointer;
	    width: 10%;
	    height: 10%;
	    margin:0px 5px;
	}
	.mideaimg a :hover{
	    border-bottom: 5px solid rgb(255, 0, 0);
	    border-radius: 5px;
	}
</style>
</head>
<body>

	<div th:replace="~{navbar::backnav}"></div>

	<form th:action="@{/login}" class="container" method="post">
            <div class="subcont">
                <div class="imgcont">
                    <h1>SmS</h1>
                </div>
                <div class="headingh3">
                    <h2>Login Form</h2>
                </div>
                <div class="inpcredential">
                    <p>Username :</p>
                    <input class="nametype" name="username" type="text" placeholder="Enter your username here" required>
                    
                    <p>Password :</p>
                    <input type="password" name="password" class="nametype" id="filltype" placeholder="Enter your password here" required >
                </div>
                <div class="forgetpassword">
                    <a href="">forgot password</a>
                </div>
                <div class="button">
                    <button id="submittbut">Login</button>
                </div>
                <div class="mediaopt">
                    <p>Or continue with</p>
                    <div class="mideaimg">
                        <a id="opt" href=""><img src="apple.png" alt="github"></a>
                        <a id="opt" href=""><img src="google.png" alt="google"></a>
                        <a id="opt" href=""><img src="Facebook.png" alt="facebook"></a>
                    </div>
                </div>
            </div>
        </form>
</body>
</html>
