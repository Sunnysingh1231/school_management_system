<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SmS Super Admin</title>
    <link rel="stylesheet" th:href="@{/super_admin_css/header.css}">
	<style>
		
		.school-list{
			padding:40px;
			text-align:center;
		}
			
		.school-list h2{
			color:#ff758c;
			margin-bottom:20px;
		}
			
		table{
			width:50%;
			margin:auto;
			border-collapse:collapse;
			background:white;
			border-radius:10px;
			overflow:hidden;
			box-shadow:0 5px 10px rgba(0,0,0,0.2);
		}
			
		th,td{
			padding:12px;
			border-bottom:1px solid #ddd;
		}
			
		th{
			background:#ff7eb3;
			color:white;
		}
			
		tr:hover{
			background:#f5f5f5;
		}
			
		.ancer{
			padding:6px 12px;
			border-radius:15px;
			text-decoration:none;
			font-size:14px;
			margin:2px;
		}
			
		.view{
			background:#4ecdc4;
			color:white;
		}
			
		.edit{
			background:#ffcc00;
			color:black;
		}
			
		.delete{
			background:#ff6b6b;
			color:white;
		}
	
	</style>
</head>
<body>

	<div th:replace="~{/school_admin/navbar::admin_navbar}"></div>
	
	
	<section class="school-list">
	
		<h2>Assign Class-Teacher to class</h2>
		
		<table>
		
			<thead>
				<tr>
					<th>ID</th>
					<th>Name</th>
					<th>Section</th>
					<th>Class Teacher</th>
					<th>Actions</th>
				</tr>
			</thead>
			
			<tbody>
			
				<tr th:each="class : ${classes}">
				
					<td th:text="${class.id}"></td>
					<td th:text="${class.className}"></td>
					<td th:text="${class.section}"></td>
					<td th:text="${class.classTeacher != null ? class.classTeacher.name : 'No Class Teacher'}"></td>
					<td>
						<a th:href="@{/admin/edit-class-teacher/{id}(id=${class.id})}" class="ancer edit">Edit Class Teacher</a>
					</td>
				
				</tr>
			
			</tbody>
		
		</table>
	
	</section>
	
</body>
</html>
