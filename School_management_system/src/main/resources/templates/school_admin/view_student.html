<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SmS Super Admin</title>
    <link rel="stylesheet" th:href="@{/super_admin_css/header.css}">
	<style>
        body {
            margin: 0;
            font-family: Arial;
            background: #fdf6e3;
        }

        /* Container */
        .container {
            padding: 30px;
        }

        /* Filter Box */
        .filter-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-box select,
        .filter-box button {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .filter-box button {
            background: #ffcc00;
            font-weight: bold;
            cursor: pointer;
        }

        /* Table */

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        th,
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #ff758c;
            color: white;
        }

        tr:hover {
            background: #f5f5f5;
        }
    </style>
</head>
<body>

	<div th:replace="~{/school_admin/navbar::admin_navbar}"></div>
	

    <div class="container">

        <h2>Student List</h2>

        <!-- 🔍 Filter Form -->
        <form th:method="get" th:action="@{/admin/view-student}" class="filter-box">

            <select name="cls" required>
                <option value="all">All Classes</option>
                <option value="Play Group">Play Group</option>
                <option value="LKG">LKG</option>
                <option value="UKG">UKG</option>
                <option value="1">Class 1</option>
                <option value="2">Class 2</option>
                <option value="3">Class 3</option>
                <option value="4">Class 4</option>
                <option value="5">Class 5</option>
                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
                <option value="11">Class 11</option>
                <option value="12">Class 12</option>
            </select>

            <select name="sec" required>
                <option value="all">All Sections</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
            </select>

            <button type="submit">Filter</button>

        </form>

		<div class="stat-card" style="display: flex; align-items: center; gap: 10px;">
            <h3>Total Students:</h3>
            <h3 th:text="${students.size()}">345</h3>
        </div>
        <!-- 📋 Student Table -->

        <table>

            <thead>
                <tr>
                	<th>#</th>
                    <th>Roll No.</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Gender</th>
                    <th>Class</th>
                    <th>Section</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="student,c : ${students}">
                	<td th:text="${c.index+1}"></td>
                    <td th:text="${student.rollNumber}"></td>
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.email}"></td>
                    <td th:text="${student.phone}"></td>
                    <td th:text="${student.gender}"></td>
                    <td th:text="${student.classEntity.className}"></td>
                    <td th:text="${student.classEntity.section}"></td>
                </tr>

            </tbody>

        </table>

    </div>

</body>
</html>
