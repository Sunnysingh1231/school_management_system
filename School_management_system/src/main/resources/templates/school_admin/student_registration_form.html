<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/super_admin_css/header.css}">
    <title>Student Registration</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#fdf6e3;

            display:flex;
            flex-direction:column;
            min-height:100vh;
        }

        /* Form Section */

        .register-section{
            flex:1;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px 20px;
        }

        .card{
            background:white;
            padding:30px;
            width:400px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        .card h2{
            text-align:center;
            color:#ff758c;
            margin-bottom:20px;
        }

        /* Inputs */

        .input-group{
            margin-bottom:15px;
            display:flex;
            flex-direction:column;
        }

        .input-group label{
            font-weight:bold;
            margin-bottom:5px;
        }

        .input-group input,
        .input-group select{
            padding:10px;
            border-radius:8px;
            border:1px solid #ccc;
        }

        /* Button */

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:20px;
            background:#ffcc00;
            font-weight:bold;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background:#ffaa00;
        }

        .role{
            background:#f1f1f1;
			outline: none;
			cursor:default;
        }

        .phone-box{
            display:flex;
            align-items:center;
            border:1px solid #ccc;
            border-radius:8px;
            overflow:hidden;
        }

        .phone-box span{
            /* background:#eee; */
            padding:10px;
            font-weight:bold;
        }

        .phone-box input{
            border:none;
            outline:none;
            padding:10px;
            flex:1;
        }

        /* Footer */

        footer{
            background:#ff758c;
            color:white;
            text-align:center;
            padding:15px;
        }

    </style>

</head>

<body>

    	<div th:replace="~{/school_admin/navbar::admin_navbar}"></div>
    

    <section class="register-section">

        <div class="card">

            <h2>Student Registration</h2>

            <form th:action="@{/admin/register-student}" method="post" th:object="${student}">

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" th:field="*{name}" placeholder="Enter Full Name" required>
                </div>

                <div class="input-group">
                    <label>Roll No.</label>
                    <input type="number" th:field="*{rollNumber}" placeholder="Enter Roll Numbere" required>
                </div>

                <div class="input-group">
                    <label>Gender</label>
                    <select th:field="*{gender}">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Phone</label>
                    <div class="phone-box" >
                        <span>+91</span>
                        <input type="text"  th:field="*{phone}" placeholder="Enter mobile number">
                    </div>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email"  th:field="*{email}" placeholder="Enter Email">
                </div>

                <div class="input-group">
                    <label>Date Of Birth</label>
                    <input type="date"  th:field="*{dateOfBirth}">
                </div>

                <div class="input-group">
                    <label>Parent Name</label>
                    <input type="text"  th:field="*{parentName}" placeholder="Enter Parent Name" required>
                </div>

                <div class="input-group">
                    <label>Parent Phone</label>
                    <div class="phone-box">
                        <span>+91</span>
                        <input type="text"  th:field="*{parentPhone}" placeholder="Enter mobile number">
                    </div>
                </div>

                <div class="input-group">
                    <label>Class</label>
                    <select  name="classn">
                        <option>Select Class</option>
                        <option vlaue="Play Group">Play Group</option>
                        <option value="LKG">Class LKG</option>
                        <option value="UKG">Class UKG</option>
                        <option value="1">Class 1</option>
                        <option value="2">Class 2</option>
                        <option value="3">Class 3</option>
                        <option value="4">Class 4</option>
                        <option value="5">Class 5</option>
                        <option value="6">Class 6</option>
                        <option value="7">Class 7</option>
                        <option value="8">Class 8</option>
                        <option value="9">Class 9</option>
                        <option value="10">Class 10</option>
                        <option value="11">Class 11</option>
                        <option value="12">Class 12</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Section</label>
                    <select  name="section">
        				
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password"  th:field="*{password}" placeholder="Enter Password" required>
                </div>

                <div class="input-group">
                    <label>Role</label>
                    <input type="text" class="role" value="STUDENT" readonly>
                </div>

                <button type="submit">Register Student</button>

            </form>

        </div>

    </section>

    <footer>
    <p>© 2026 Smart School</p>
    </footer>

</body>
</html>
