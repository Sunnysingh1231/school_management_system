<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- CSRF Token -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    

    <title>Forgot Password</title>
    <link rel="stylesheet" th:href="@{header.css}">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        justify-content: center;
        align-items: center;
    }

    .container {
    	margin-top:50px;
        width: 100%;
        padding: 20px;
        display: flex;
        justify-content: center;
    }

    .card {
        width: 420px;
        background: #ffffff;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
        text-align: center;
    }

    .card h2 {
        color: #222;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #666;
        font-size: 14px;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 13px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 9px;
        font-size: 15px;
    }

    input:focus {
        border-color: #4facfe;
        outline: none;
    }

    .card button {
        width: 100%;
        padding: 13px;
        margin-top: 12px;
        border: none;
        border-radius: 9px;
        background: #4facfe;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #2196f3;
    }

    button:disabled {
        background: #9cccf5;
        cursor: not-allowed;
    }

    #message {
        margin-bottom: 15px;
        font-size: 14px;
        font-weight: bold;
    }

    .success {
        color: green;
    }

    .error {
        color: red;
    }

    .hide {
        display: none;
    }

    #loader {
        margin-top: 15px;
        color: #2196f3;
        font-size: 14px;
        font-weight: bold;
    }

    .spinner {
        width: 35px;
        height: 35px;
        border: 4px solid #ddd;
        border-top: 4px solid #2196f3;
        border-radius: 50%;
        margin: 0 auto 8px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    .back-link {
        display: inline-block;
        margin-top: 18px;
        color: #2196f3;
        text-decoration: none;
        font-size: 14px;
    }

    .back-link:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        body {
            align-items: flex-start;
        }

        .container {
            padding: 15px;
        }

        .card {
            width: 100%;
            padding: 25px 18px;
            border-radius: 14px;
        }

        .card h2 {
            font-size: 24px;
        }

        .subtitle {
            font-size: 13px;
            line-height: 1.5;
        }

        input {
            padding: 12px;
            font-size: 14px;
        }

        button {
            padding: 12px;
            font-size: 15px;
        }

        #message {
            font-size: 13px;
            line-height: 1.4;
        }

        .spinner {
            width: 30px;
            height: 30px;
        }
    }

    @media (max-width: 360px) {
        .card {
            padding: 22px 14px;
        }

        .card h2 {
            font-size: 22px;
        }

        input,
        button {
            font-size: 14px;
        }
    }
</style>

<body>

<div th:replace="~{navbar::backnav}"></div>

<div class="container">
    <div class="card">
    
        <h2>Forgot Password</h2>
        <p class="subtitle">Reset password using Email or WhatsApp number</p>

        <p id="message"></p>

        <div id="emailSection">
            <input type="text" id="emailOrPhone" placeholder="Enter Email or WhatsApp Number">

            <button type="button" id="sendOtpBtn" onclick="sendOtp()">Send OTP</button>

            <div id="loader" class="hide">
                <div class="spinner"></div>
                <p>Sending OTP...</p>
            </div>
        </div>

        <div id="otpSection" class="hide">
            <input type="text" id="otp" maxlength="6" placeholder="Enter 6 Digit OTP">
            <button type="button" onclick="verifyOtp()">Verify OTP</button>
        </div>

        <div id="passwordSection" class="hide">
            <input type="password" id="newPassword" placeholder="Enter New Password">
            <input type="password" id="confirmPassword" placeholder="Re-enter Password">
            <button type="button" onclick="resetPassword()">Reset Password</button>
        </div>

        <a th:href="@{/login}" class="back-link">Back to Login</a>

    </div>
</div>

<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute("content");
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute("content");

    function showMessage(text, type) {
        let message = document.getElementById("message");
        message.innerHTML = text;
        message.className = type;
    }

    function sendOtp() {
        let emailOrPhone = document.getElementById("emailOrPhone").value.trim();
        let loader = document.getElementById("loader");
        let sendOtpBtn = document.getElementById("sendOtpBtn");

        if (emailOrPhone === "") {
            showMessage("Please enter Email or WhatsApp Number", "error");
            return;
        }

        showMessage("", "");
        loader.classList.remove("hide");
        sendOtpBtn.disabled = true;
        sendOtpBtn.innerText = "Please wait...";

        fetch("/send-otp", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                [csrfHeader]: csrfToken
            },
            body: "emailOrPhone=" + encodeURIComponent(emailOrPhone)
        })
        .then(response => response.text())
        .then(data => {
            showMessage(data, data === "OTP Sent Successfully" ? "success" : "error");

            if (data === "OTP Sent Successfully") {
                document.getElementById("emailSection").classList.add("hide");
                document.getElementById("otpSection").classList.remove("hide");
            }
        })
        .catch(error => {
            showMessage("Something went wrong. Please try again.", "error");
        })
        .finally(() => {
            loader.classList.add("hide");
            sendOtpBtn.disabled = false;
            sendOtpBtn.innerText = "Send OTP";
        });
    }

    function verifyOtp() {
        let emailOrPhone = document.getElementById("emailOrPhone").value.trim();
        let otp = document.getElementById("otp").value.trim();

        if (otp === "") {
            showMessage("Please enter OTP", "error");
            return;
        }

        fetch("/verify-otp", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                [csrfHeader]: csrfToken
            },
            body:
                "emailOrPhone=" + encodeURIComponent(emailOrPhone) +
                "&otp=" + encodeURIComponent(otp)
        })
        .then(response => response.text())
        .then(data => {
            showMessage(data, data === "OTP Verified" ? "success" : "error");

            if (data === "OTP Verified") {
                document.getElementById("otpSection").classList.add("hide");
                document.getElementById("passwordSection").classList.remove("hide");
            }
        })
        .catch(error => {
            showMessage("Something went wrong. Please try again.", "error");
        });
    }

    function resetPassword() {
        let emailOrPhone = document.getElementById("emailOrPhone").value.trim();
        let newPassword = document.getElementById("newPassword").value.trim();
        let confirmPassword = document.getElementById("confirmPassword").value.trim();

        if (newPassword === "" || confirmPassword === "") {
            showMessage("Please fill both password fields", "error");
            return;
        }

        if (newPassword !== confirmPassword) {
            showMessage("Passwords Do Not Match", "error");
            return;
        }

        fetch("/reset-password", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                [csrfHeader]: csrfToken
            },
            body:
                "emailOrPhone=" + encodeURIComponent(emailOrPhone) +
                "&newPassword=" + encodeURIComponent(newPassword)
        })
        .then(response => response.text())
        .then(data => {
            showMessage(data, data === "Password Reset Successful" ? "success" : "error");

            if (data === "Password Reset Successful") {
                document.getElementById("passwordSection").classList.add("hide");
            }
        })
        .catch(error => {
            showMessage("Something went wrong. Please try again.", "error");
        });
    }
</script>

</body>
</html>
