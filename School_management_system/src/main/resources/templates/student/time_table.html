<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - School Management System</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/student/dashboard.css}">
    
    <style>
    	/* ================= ASSIGNMENT PAGE ================= */

/* ================= TIMETABLE PAGE ================= */

.timetable-card {
    background: var(--bg-secondary);
    padding: 20px;
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    overflow-x: auto;
}

/* Table */
.custom-timetable {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
}

.custom-timetable th {
    padding: 12px;
    background: var(--bg-primary);
    font-size: 13px;
}

.custom-timetable td {
    padding: 12px;
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
}

/* Hover */
.custom-timetable tr:hover {
    background: var(--bg-primary);
}

/* Time column */
.time {
    font-weight: 600;
    color: var(--primary-color);
}

/* Break */
.break {
    color: var(--warning-color);
}

.break-cell {
    font-weight: 600;
    color: var(--warning-color);
}

/* Responsive */
@media (max-width: 768px) {
    .custom-timetable th,
    .custom-timetable td {
        padding: 8px;
        font-size: 11px;
    }
}
    </style>
    
    
</head>

<body>
	<div class="overlay" id="overlay"></div>

    <div class="dashboard-container">
    
	<div th:replace="~{/student/sidebar::sidebar}"> </div>
    
        

        <!-- ==================== Main Content ==================== -->
        <div class="main-content">
            <!-- ==================== Top Navbar ==================== -->
            <div th:replace="~{/student/navbar::navbar}"> </div>

			<div class="main-content">

        <div class="dashboard-content">

            <!-- Header -->
            <div class="page-header">
                <h1>Weekly Timetable 📅</h1>
                <p>Your class schedule overview</p>
            </div>

            <!-- Timetable Card -->
            <div class="timetable-card">

                <table class="custom-timetable" th:if="${!#lists.isEmpty(timetable)}">
                    <thead>
                        <tr>
                        	<th class="time">Days</th>
                            <th class="time" th:each = "rd,c : ${timetable[1].periods}" th:text = "'P'+${c.index+1}">Time</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each = "table, c : ${timetable}">
                        
                            <td class="time break" th:text = "${table.day}" ></td>
                            <td th:each = "sub : ${table.periods}">
                            	<span th:if = "${sub.startTime}" th:text = "${sub.startTime}+' - '+${sub.endTime}"></span><br>
                            	<h4 th:text = "${sub.subject}" th:class = "${sub.subject} == 'Break' ? 'break-cell' : 'time'"></h4>
                            </td>
                            
                        </tr>
                    </tbody>
                </table>
				<div class="assignments-list" th:if="${#lists.isEmpty(timetable)}"
		style="text-align: center;">
		<div>
			<p>No assignments available.</p>
		</div>
	</div>
            </div>
			
        </div>
    </div>
            
        </div>
<script th:src="@{/student_js/index.js}"></script>
        
</body>

</html>
