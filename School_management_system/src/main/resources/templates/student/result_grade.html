<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - School Management System</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/student/dashboard.css}">
    
    <style>
    	/* ================= ASSIGNMENT PAGE ================= */

/* ================= RESULT PAGE ================= */

.result-table-container {
    background: var(--bg-secondary);
    padding: 20px;
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    overflow-x: auto;
}

.result-table {
    width: 100%;
    border-collapse: collapse;
}

.result-table th {
    text-align: left;
    padding: 12px;
    background: var(--bg-primary);
    font-size: 13px;
}

.result-table td {
    padding: 12px;
    border-bottom: 1px solid var(--border-color);
}

.result-table tr:hover {
    background: var(--bg-primary);
}

/* Status */
.pass {
    color: var(--success-color);
    font-weight: 600;
}

.fail {
    color: var(--danger-color);
    font-weight: 600;
}
    </style>
    
    
</head>

<body>

    <div class="dashboard-container">
    
	<div th:replace="~{/student/sidebar::sidebar}"> </div>
    
        

        <!-- ==================== Main Content ==================== -->
        <div class="main-content">
            <!-- ==================== Top Navbar ==================== -->
            <div th:replace="~{/student/navbar::navbar}"> </div>

			<div class="main-content">

        <div class="dashboard-content">

            <!-- Header -->
            <div class="page-header">
                <h1>Results & Grades 🎓</h1>
                <p>Your academic performance overview</p>
            </div>

            <!-- Summary Cards -->
            <div class="summary-section">

                <div class="summary-card">
                    <div class="summary-card-title">Overall Percentage</div>
                    <div class="summary-card-value">87%</div>
                </div>

                <div class="summary-card">
                    <div class="summary-card-title">GPA</div>
                    <div class="summary-card-value">3.85</div>
                </div>

                <div class="summary-card">
                    <div class="summary-card-title">Rank</div>
                    <div class="summary-card-value">5th</div>
                </div>

            </div>

            <!-- Result Table -->
            <div class="result-table-container">

                <table class="result-table">
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Marks</th>
                            <th>Max Marks</th>
                            <th>Grade</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Mathematics</td>
                            <td>92</td>
                            <td>100</td>
                            <td>A+</td>
                            <td class="pass">Pass</td>
                        </tr>

                        <tr>
                            <td>Physics</td>
                            <td>85</td>
                            <td>100</td>
                            <td>A</td>
                            <td class="pass">Pass</td>
                        </tr>

                        <tr>
                            <td>Chemistry</td>
                            <td>80</td>
                            <td>100</td>
                            <td>B+</td>
                            <td class="pass">Pass</td>
                        </tr>

                        <tr>
                            <td>English</td>
                            <td>78</td>
                            <td>100</td>
                            <td>B+</td>
                            <td class="pass">Pass</td>
                        </tr>

                        <tr>
                            <td>Biology</td>
                            <td>88</td>
                            <td>100</td>
                            <td>A</td>
                            <td class="pass">Pass</td>
                        </tr>
                    </tbody>
                </table>

            </div>

        </div>
    </div>
            
        </div>
<script>
        // Hamburger menu toggle for mobile
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebar = document.getElementById('sidebar');

        hamburgerBtn.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        // Close sidebar when clicking on a menu item (mobile)
        const sidebarLinks = document.querySelectorAll('.sidebar-menu-link');
        sidebarLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    sidebar.classList.remove('active');
                }
            });
        });

        // Close sidebar when clicking outside of it (mobile)
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && !hamburgerBtn.contains(e.target)) {
                    sidebar.classList.remove('active');
                }
            }
        });

        // Add smooth scroll behavior
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        const menuLinks = document.querySelectorAll('.sidebar-menu-link');

        menuLinks.forEach(link => {
            link.addEventListener('click', function () {
                // Remove active from all
                menuLinks.forEach(item => item.classList.remove('active'));

                // Add active to clicked one
                this.classList.add('active');
            });
        });
    </script>
        
</body>

</html>
