<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - School Management System</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/student/dashboard.css}">
    
    <style>
    	/* ================= ASSIGNMENT PAGE ================= */

/* ================= FEES PAGE ================= */

.fees-status-card {
    background: var(--bg-secondary);
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 30px;
    box-shadow: var(--shadow-md);
}

/* Table */
.fees-table-container {
    background: var(--bg-secondary);
    padding: 20px;
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    overflow-x: auto;
}

.fees-table {
    width: 100%;
    border-collapse: collapse;
}

.fees-table th {
    text-align: left;
    padding: 12px;
    background: var(--bg-primary);
}

.fees-table td {
    padding: 12px;
    border-bottom: 1px solid var(--border-color);
}

.fees-table tr:hover {
    background: var(--bg-primary);
}

/* Status */
.paid {
    color: var(--success-color);
    font-weight: 600;
}

.pending {
    color: var(--warning-color);
    font-weight: 600;
}

/* Pay Button */
.pay-btn-container {
    margin-top: 20px;
    text-align: right;
}

.pay-btn {
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
}

.pay-btn:hover {
    opacity: 0.9;
}
    
    </style>
    
    
</head>

<body>

    <div class="dashboard-container">
    
	<div th:replace="~{/student/sidebar::sidebar}"> </div>
    
        

        <!-- ==================== Main Content ==================== -->
        <div class="main-content">
            <!-- ==================== Top Navbar ==================== -->
            <div th:replace="~{/student/navbar::navbar}"> </div>

			<div class="main-content">

        <div class="dashboard-content">

            <!-- Header -->
            <div class="page-header">
                <h1>Fees 💰</h1>
                <p>Track your fee payments and dues</p>
            </div>

            <!-- Summary Cards -->
            <div class="summary-section">

                <div class="summary-card">
                    <div class="summary-card-title">Total Fees</div>
                    <div class="summary-card-value">₹50,000</div>
                </div>

                <div class="summary-card">
                    <div class="summary-card-title">Paid Amount</div>
                    <div class="summary-card-value">₹35,000</div>
                </div>

                <div class="summary-card">
                    <div class="summary-card-title">Pending</div>
                    <div class="summary-card-value">₹15,000</div>
                </div>

            </div>

            <!-- Payment Status -->
            <div class="fees-status-card">
                <h3>Payment Progress</h3>

                <div class="progress-bar">
                    <div class="progress-fill" style="width: 70%"></div>
                </div>

                <p>70% Paid</p>
            </div>

            <!-- Fees Table -->
            <div class="fees-table-container">

                <table class="fees-table">
                    <thead>
                        <tr>
                            <th>Fee Type</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Due Date</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Tuition Fee</td>
                            <td>₹20,000</td>
                            <td class="paid">Paid</td>
                            <td>-</td>
                        </tr>

                        <tr>
                            <td>Exam Fee</td>
                            <td>₹5,000</td>
                            <td class="paid">Paid</td>
                            <td>-</td>
                        </tr>

                        <tr>
                            <td>Library Fee</td>
                            <td>₹5,000</td>
                            <td class="pending">Pending</td>
                            <td>15 Apr 2026</td>
                        </tr>

                        <tr>
                            <td>Transport Fee</td>
                            <td>₹20,000</td>
                            <td class="pending">Pending</td>
                            <td>20 Apr 2026</td>
                        </tr>
                    </tbody>
                </table>

            </div>

            <!-- Pay Button -->
            <div class="pay-btn-container">
                <button class="pay-btn">
                    <i class="fas fa-credit-card"></i> Pay Now
                </button>
            </div>

        </div>
    </div>
            
        </div>
<script>
        // Hamburger menu toggle for mobile
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebar = document.getElementById('sidebar');

        hamburgerBtn.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        // Close sidebar when clicking on a menu item (mobile)
        const sidebarLinks = document.querySelectorAll('.sidebar-menu-link');
        sidebarLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    sidebar.classList.remove('active');
                }
            });
        });

        // Close sidebar when clicking outside of it (mobile)
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && !hamburgerBtn.contains(e.target)) {
                    sidebar.classList.remove('active');
                }
            }
        });

        // Add smooth scroll behavior
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        const menuLinks = document.querySelectorAll('.sidebar-menu-link');

        menuLinks.forEach(link => {
            link.addEventListener('click', function () {
                // Remove active from all
                menuLinks.forEach(item => item.classList.remove('active'));

                // Add active to clicked one
                this.classList.add('active');
            });
        });
    </script>
        
</body>

</html>
