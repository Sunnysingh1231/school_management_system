<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - School Management System</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/student/dashboard.css}">

    <style>
        .profile-page-card {
            background: var(--bg-secondary);
            border-radius: 15px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        /* Banner */
        .profile-banner {
            height: 150px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            position: relative;
        }

        /* Large Avatar */
        .profile-avatar-large {
            position: absolute;
            bottom: -50px;
            left: 30px;
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }

        /* Main Info */
        .profile-main-info {
            padding: 70px 30px 30px;
        }

        .profile-main-info h2 {
            font-size: 24px;
            font-weight: 700;
        }

        .profile-main-info p {
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        /* Buttons */
        .profile-actions {
            display: flex;
            gap: 10px;
        }

        .btn-edit,
        .btn-message {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Poppins';
            font-size: 14px;
        }

        .btn-edit {
            background: var(--primary-color);
            color: white;
        }

        .btn-message {
            background: var(--secondary-color);
            color: white;
        }

        /* Details Grid */
        .profile-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px 30px 30px;
        }

        /* Box */
        .detail-box {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            transition: 0.3s;
        }

        .detail-box:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .detail-box h4 {
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .detail-box p {
            font-size: 14px;
            margin-bottom: 5px;
        }

        /* ================= Bottom Actions ================= */

        .profile-bottom-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px 30px 30px;
            border-top: 1px solid var(--border-color);
        }

        /* Edit Button */
        .profile-bottom-actions .btn-edit {
            background: var(--primary-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .profile-bottom-actions .btn-edit:hover {
            background: var(--primary-dark);
        }

        /* Change Password Button */
        .btn-password {
            background: var(--secondary-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-password:hover {
            opacity: 0.9;
        }
    </style>


</head>

<body>

    <div class="dashboard-container">

        <div th:replace="~{/student/sidebar::sidebar}"> </div>



        <!-- ==================== Main Content ==================== -->
        <div class="main-content">
            <!-- ==================== Top Navbar ==================== -->
            <div th:replace="~{/student/navbar::navbar}"> </div>

            <div class="dashboard-content">

                <!-- Profile Card -->
                <div class="profile-page-card">

                    <!-- Top Banner -->
                    <div class="profile-banner">
                        <div class="profile-avatar-large">
                            <i class="fas fa-user"></i>
                        </div>
                    </div>

                    <!-- Info Section -->
                    <div class="profile-main-info">
                        <h2 th:text="${student.name}">Arjun Joshi</h2>
                        <p th:text="${'Class '+student.classEntity.className+'-'+student.classEntity.section}">Class
                            12-A | Science Stream</p>
                    </div>

                    <!-- Details Grid -->
                    <div class="profile-details-grid">

                        <div class="detail-box">
                            <h4>Personal Info</h4>
                            <p><strong>Roll No: </strong> <span th:text="${student.rollNumber}"></span></p>
                            <p><strong>DOB: </strong><span th:text="${student.dateOfBirth}"></span></p>
                            <p><strong>Gender: </strong><span th:text="${student.gender}">Male</span></p>
                        </div>

                        <div class="detail-box">
                            <h4>Contact Info</h4>
                            <p><strong>Email: </strong><span th:text="${student.email}"></span></p>
                            <p><strong>Phone: </strong> +91 <span th:text="${student.phone}"></span></p>
                            <p><strong>Address: </strong> <span th:text="${student.address}"></span></p>
                        </div>

                        <div class="detail-box">
                            <h4>Academic Info</h4>
                            <p><strong>Class: </strong><span
                                    th:text="${student.classEntity.className+'-'+student.classEntity.section}"></span>
                            </p>
                            <p><strong>Stream: </strong> Science</p>
                            <p><strong>GPA: </strong> 3.85</p>
                        </div>

                        <div class="detail-box">
                            <h4>Guardian Info</h4>
                            <p><strong>Name: </strong><span th:text="${student.parentName}"></span></p>
                            <p><strong>Relation: </strong> Father</p>
                            <p><strong>Phone: </strong> +91 <span th:text="${student.parentPhone}"></span></p>
                        </div>

                    </div>

                    <!-- ✅ NEW BOTTOM BUTTONS -->
                    <div class="profile-bottom-actions">
                        <a class="btn-edit" th:href="@{/student/profile-edit}">
                            <i class="fas fa-edit"></i> Edit Profile
                        </a>

                        <a class="btn-password" th:href="@{/student/change-password}">
                            <i class="fas fa-lock"></i> Change Password
                        </a>
                    </div>

                </div>

            </div>

        </div>
        <script>
            // Hamburger menu toggle for mobile
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const sidebar = document.getElementById('sidebar');

            hamburgerBtn.addEventListener('click', () => {
                sidebar.classList.toggle('active');
            });

            // Close sidebar when clicking on a menu item (mobile)
            const sidebarLinks = document.querySelectorAll('.sidebar-menu-link');
            sidebarLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth <= 768) {
                        sidebar.classList.remove('active');
                    }
                });
            });

            // Close sidebar when clicking outside of it (mobile)
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 768) {
                    if (!sidebar.contains(e.target) && !hamburgerBtn.contains(e.target)) {
                        sidebar.classList.remove('active');
                    }
                }
            });

            // Add smooth scroll behavior
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });

            const menuLinks = document.querySelectorAll('.sidebar-menu-link');

            menuLinks.forEach(link => {
                link.addEventListener('click', function () {
                    // Remove active from all
                    menuLinks.forEach(item => item.classList.remove('active'));

                    // Add active to clicked one
                    this.classList.add('active');
                });
            });
        </script>

        <script th:inline="javascript">
            let successMsg = /*[[${success}]]*/ null;
            let errorMsg = /*[[${error}]]*/ null;

            if (successMsg) {
                alert(successMsg);
            }

            if (errorMsg) {
                alert(errorMsg);
            }
        </script>

</body>

</html>
