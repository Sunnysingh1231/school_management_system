<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard - School Management System</title>

<!-- Google Fonts -->
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
	rel="stylesheet">

<!-- Font Awesome Icons -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- External CSS -->
<link rel="stylesheet" th:href="@{/student/dashboard.css}">

<style>
:root {
	--primary: #6366f1;
	--secondary: #8b5cf6;
	--bg: #f8fafc;
}

body {
	margin: 0;
	font-family: 'Poppins', sans-serif;
	background: var(--bg);
}

.container {
	margin: 120px 20px 0px 300px;
	padding: 15px;
}

.card {
	max-width: 500px;
	background: linear-gradient(135deg, var(--primary), var(--secondary));
	padding: 30px;
	border-radius: 20px;
	color: white;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
	margin:auto;
}

.title {
	text-align: center;
	margin-bottom: 25px;
}

.form-grid {
	display: grid;
	gap: 15px;
}

.input-group {
	display: flex;
	flex-direction: column;
}

.input-group label {
	font-size: 14px;
}

.input-group input {
	padding: 12px;
	border-radius: 10px;
	border: none;
	margin-top: 5px;
	background: rgba(255, 255, 255, 0.2);
	color: white;
	outline: none;
}

.input-group input::placeholder {
	color: rgba(255, 255, 255, 0.7);
	/* light white */
}

.error {
	color: #fe7474;
	font-size: 12px;
	margin-top: 4px;
}

.btncont {
	width: 100%;
	display: flex;
	margin: auto;
	gap: 10px;
}

.btncont .btn:nth-child(2) {
	background: linear-gradient(135deg, rgb(255, 187, 0), rgb(128, 0, 0));
}

.btn {
	width: 100%;
	padding: 14px;
	border: none;
	border-radius: 25px;
	background: linear-gradient(135deg, #1e3c72, #2a5298);
	color: white;
	font-weight: 600;
	cursor: pointer;
	margin-top: 10px;
	transform: .3s;
}

.btn:hover {
	transform: translateY(-2px);
	box-shadow: rgba(17, 17, 26, 0.1) 0px 4px 16px, rgba(17, 17, 26, 0.1)
		0px 8px 24px, rgba(17, 17, 26, 0.1) 0px 16px 56px;
}

@media ( max-width :768px) {
	.container {
		margin: 80px auto;
		width: 100%;
		/* border: 2px solid red; */
	}
	.form-grid {
		grid-template-columns: 1fr;
	}
	.btn {
		grid-column: span 1;
	}
}
</style>


</head>

<body>

	<div class="dashboard-container">

		<div th:replace="~{/student/sidebar::sidebar}"></div>



		<!-- ==================== Main Content ==================== -->
		<div class="main-content">
			<!-- ==================== Top Navbar ==================== -->
			<div th:replace="~{/student/navbar::navbar}"></div>

			<div class="container">
				<div class="card">

					<div class="title">
						<h2>Change Password</h2>
					</div>

					<form id="passwordForm" class="form-grid" th:method="post"
						th:action="@{/student/update-password}" onsubmit="return validatePasswords();">

						<div class="input-group">
							<label>Old Password</label> <input type="password"
								id="oldPassword" name="oldPassword"
								placeholder="Enter old password" required>
							<div class="error" id="oldError"></div>
						</div>

						<div class="input-group">
							<label>New Password</label> <input type="password"
								id="newPassword" name="newPassword"
								placeholder="Enter new password" required>
							<div class="error" id="newError"></div>
						</div>

						<div class="input-group">
							<label>Confirm Password</label> <input type="password"
								id="confirmPassword" name="confirmPassword"
								placeholder="Re-enter new password" required>
							<div class="error" id="confirmError"></div>
						</div>

						<!-- 

    <button type="submit" class="btn">Update Password</button>
	 -->
						<div class="btncont">

							<button class="btn" onclick="history.back()">Back</button>
							<button type="button" class="btn" onclick="updatePassword(this)">Update Password</button>

						</div>

					</form>

				</div>
			</div>



		</div>
		<script th:if="${success}" th:inline="javascript">
    alert('[[${success}]]');
</script>

		<script th:if="${error}" th:inline="javascript">
    alert('[[${error}]]');
</script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


		<script>
        // Hamburger menu toggle for mobile
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebar = document.getElementById('sidebar');

        hamburgerBtn.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        // Close sidebar when clicking on a menu item (mobile)
        const sidebarLinks = document.querySelectorAll('.sidebar-menu-link');
        sidebarLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    sidebar.classList.remove('active');
                }
            });
        });

        // Close sidebar when clicking outside of it (mobile)
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && !hamburgerBtn.contains(e.target)) {
                    sidebar.classList.remove('active');
                }
            }
        });

        
        function updatePassword(button) {

            // Validate first
            if (!validatePasswords()) {
                return; // Stop if validation fails
            }

            // Show confirmation
            Swal.fire({
                title: "Update Password?",
                text: "Are you sure you want to update your password?",
                icon: "question",
                showCancelButton: true,
                confirmButtonText: "Yes, Update",
                cancelButtonText: "Cancel"
            }).then((result) => {

                if (result.isConfirmed) {
                    button.closest("form").submit();
                }

            });
        }
    </script>
    
    <script>
function validatePasswords() {
    let isValid = true;

    const newPassword = document.getElementById("newPassword").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();

    const newError = document.getElementById("newError");
    const confirmError = document.getElementById("confirmError");

    // Clear previous errors
    newError.innerHTML = "";
    confirmError.innerHTML = "";

    // Password validation
    const passwordRegex =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&^#])[A-Za-z\d@$!%*?&^#]{8,}$/;

    if (newPassword === "") {
        newError.innerHTML = "Please enter a new password.";
        isValid = false;
    } else if (!passwordRegex.test(newPassword)) {
        newError.innerHTML =
            "Password must be at least 8 characters and contain uppercase, lowercase, number, and special character.";
        isValid = false;
    }

    // Confirm password validation
    if (confirmPassword === "") {
        confirmError.innerHTML = "Please confirm your password.";
        isValid = false;
    } else if (newPassword !== confirmPassword) {
        confirmError.innerHTML = "Passwords do not match.";
        isValid = false;
    }

    return isValid;
}
</script>
</body>

</html>
