<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - School Management System</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/student/dashboard.css}">
    
    <style>
    	:root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --bg: #f8fafc;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
        }

        .container {
            width: 500px;
            margin: 80px auto;
            padding: 15px;
        }

        .card {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 30px;
            border-radius: 20px;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 14px;
        }

        .input-group input {
            padding: 12px;
            border-radius: 10px;
            border: none;
            margin-top: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            outline: none;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
            /* light white */
        }

        .error {
            color: #fe7474;
            font-size: 12px;
            margin-top: 4px;
        }
        
        .btncont{
        width:100%;
        	display:flex;
        	margin:auto;
        	gap:10px;
        }
        
        .btncont .btn:nth-child(2){
        	background: linear-gradient(135deg, rgb(255, 187, 0), rgb(128, 0, 0));
        }

        .btn {
        	width:100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transform: .3s;
            
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: rgba(17, 17, 26, 0.1) 0px 4px 16px, rgba(17, 17, 26, 0.1) 0px 8px 24px, rgba(17, 17, 26, 0.1) 0px 16px 56px;
        }
    </style>
    
    
</head>

<body>

    <div class="dashboard-container">
    
	<div th:replace="~{/student/sidebar::sidebar}"> </div>
    
        

        <!-- ==================== Main Content ==================== -->
        <div class="main-content">
            <!-- ==================== Top Navbar ==================== -->
            <div th:replace="~{/student/navbar::navbar}"> </div>

			<div class="container">
        <div class="card">

            <div class="title">
                <h2>Change Password</h2>
            </div>

            <form id="passwordForm" class="form-grid" th:method="post" th:action="@{/student/update-password}">

    <div class="input-group">
        <label>Old Password</label>
        <input type="password" id="oldPassword" name="oldPassword" placeholder="Enter old password" required>
        <div class="error" id="oldError"></div>
    </div>

    <div class="input-group">
        <label>New Password</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required>
        <div class="error" id="newError"></div>
    </div>

    <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter new password" required>
        <div class="error" id="confirmError"></div>
    </div>
    
    <!-- 

    <button type="submit" class="btn">Update Password</button>
	 -->
	<div class="btncont">
                    
                    	<button class="btn" onclick="history.back()">Back</button>
                    	<button type="submit" class="btn">Update Password</button>
                    
                    </div>

</form>

        </div>
    </div>

    
            
        </div>
        <script th:if="${success}" th:inline="javascript">
    alert('[[${success}]]');
</script>

<script th:if="${error}" th:inline="javascript">
    alert('[[${error}]]');
</script>
        
<script>
        // Hamburger menu toggle for mobile
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebar = document.getElementById('sidebar');

        hamburgerBtn.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        // Close sidebar when clicking on a menu item (mobile)
        const sidebarLinks = document.querySelectorAll('.sidebar-menu-link');
        sidebarLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    sidebar.classList.remove('active');
                }
            });
        });

        // Close sidebar when clicking outside of it (mobile)
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && !hamburgerBtn.contains(e.target)) {
                    sidebar.classList.remove('active');
                }
            }
        });

        // Add smooth scroll behavior
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

    </script>
        
</body>

</html>
