

<div th:fragment="sidebar">

        <!-- ==================== Sidebar ==================== -->

                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div>
                    <h2>StudyHub</h2>
                    <p>Student Panel</p>
                </div>
            </div>

            <ul class="sidebar-menu">
                <li class="sidebar-menu-item">
                    <a th:href="@{/student}" 
   th:classappend="${activePage == 'dashboard'} ? 'active'" 
   class="sidebar-menu-link">
                        <i class="fas fa-chart-line"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a th:href="@{/student/profile}" 
   th:classappend="${activePage == 'profile'} ? 'active'" 
   class="sidebar-menu-link">
                        <i class="fas fa-user-circle"></i>
                        <span>Profile</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a th:href="@{/student/attendence}" 
   th:classappend="${activePage == 'attendance'} ? 'active'" 
   class="sidebar-menu-link">
                        <i class="fas fa-calendar-check"></i>
                        <span>Attendance</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a th:href="@{/student/assignment}" 
   th:classappend="${activePage == 'assignment'} ? 'active'" 
   class="sidebar-menu-link">
                        <i class="fas fa-tasks"></i>
                        <span>Assignments</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a th:href="@{/student/result-grade}" 
   th:classappend="${activePage == 'result_grade'} ? 'active'" 
   class="sidebar-menu-link">
                        <i class="fas fa-award"></i>
                        <span>Results/Grades</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                   <a th:href="@{/student/fees}" 
   th:classappend="${activePage == 'fees'} ? 'active'" 
   class="sidebar-menu-link">
                        <i class="fas fa-credit-card"></i>
                        <span>Fees</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a th:href="@{/student/time-table}" 
   th:classappend="${activePage == 'time_table'} ? 'active'" 
   class="sidebar-menu-link">
                        <i class="fas fa-clock"></i>
                        <span>Timetable</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a th:href="@{/student/notice}" 
   th:classappend="${activePage == 'notice'} ? 'active'" 
   class="sidebar-menu-link">
                        <i class="fas fa-bell"></i>
                        <span>Notifications</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a th:href="@{/student/setting}" 
   th:classappend="${activePage == 'setting'} ? 'active'" 
   class="sidebar-menu-link">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-logout">
    <form th:action="@{/logout}" method="post">
        <!-- CSRF Token -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <button type="submit" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </button>
    </form>
</div>
        </aside>

    </div>

    <script>
        // Hamburger menu toggle for mobile
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebar = document.getElementById('sidebar');

        hamburgerBtn.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        // Close sidebar when clicking on a menu item (mobile)
        const sidebarLinks = document.querySelectorAll('.sidebar-menu-link');
        sidebarLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    sidebar.classList.remove('active');
                }
            });
        });

        // Close sidebar when clicking outside of it (mobile)
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && !hamburgerBtn.contains(e.target)) {
                    sidebar.classList.remove('active');
                }
            }
        });

        // Add smooth scroll behavior
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

    </script>

</div>
