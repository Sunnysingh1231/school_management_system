<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - School Management System</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/student/dashboard.css}">
    
    <style>
    	/* ================= ASSIGNMENT PAGE ================= */

/* ================= SETTINGS PAGE ================= */

.settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 25px;
}

/* Card */
.settings-card {
    background: var(--bg-secondary);
    padding: 25px;
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-color);
}

.settings-card h3 {
    margin-bottom: 20px;
    font-size: 18px;
}

/* Form */
.form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 15px;
}

.form-group label {
    font-size: 13px;
    margin-bottom: 5px;
}

.form-group input {
    padding: 10px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    outline: none;
}

.form-group input:focus {
    border-color: var(--primary-color);
}

/* Buttons */
.save-btn {
    background: var(--primary-color);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
}

.save-btn.danger {
    background: var(--danger-color);
}

/* Toggle */
.toggle-group {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

/* Switch */
.switch {
    position: relative;
    display: inline-block;
    width: 45px;
    height: 24px;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    cursor: pointer;
    background: #ccc;
    border-radius: 34px;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    transition: 0.3s;
}

.slider:before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
}

input:checked + .slider {
    background: var(--primary-color);
}

input:checked + .slider:before {
    transform: translateX(20px);
}

/* Danger Zone */
.danger-zone {
    border: 1px solid var(--danger-color);
}

.danger-btn {
    width: 100%;
    padding: 12px;
    background: var(--danger-color);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* Responsive */
@media (max-width: 768px) {
    .settings-grid {
        grid-template-columns: 1fr;
    }
}
    
    </style>
    
    
</head>

<body>

    <div class="dashboard-container">
    
	<div th:replace="~{/student/sidebar::sidebar}"> </div>
    
        

        <!-- ==================== Main Content ==================== -->
        <div class="main-content">
            <!-- ==================== Top Navbar ==================== -->
            <div th:replace="~{/student/navbar::navbar}"> </div>

			<div class="main-content">

        <div class="dashboard-content">

            <!-- Header -->
            <div class="page-header">
                <h1>Account Settings ⚙️</h1>
                <p>Manage your account preferences</p>
            </div>

            <!-- Settings Grid -->
            <div class="settings-grid">

                <!-- Profile Settings -->
                <div class="settings-card">
                    <h3><i class="fas fa-user"></i> Profile Settings</h3>

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" value="Arjun Joshi">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" value="arjun@mail.com">
                    </div>

                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" value="+91 98765 43210">
                    </div>

                    <button class="save-btn">Save Changes</button>
                </div>

                <!-- Password Settings -->
                <div class="settings-card">
                    <h3><i class="fas fa-lock"></i> Change Password</h3>

                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password" placeholder="Enter current password">
                    </div>

                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" placeholder="Enter new password">
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" placeholder="Confirm new password">
                    </div>

                    <button class="save-btn danger">Update Password</button>
                </div>

                <!-- Notification Settings -->
                <div class="settings-card">
                    <h3><i class="fas fa-bell"></i> Notifications</h3>

                    <div class="toggle-group">
                        <span>Email Notifications</span>
                        <label class="switch">
                            <input type="checkbox" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="toggle-group">
                        <span>SMS Alerts</span>
                        <label class="switch">
                            <input type="checkbox">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="toggle-group">
                        <span>App Notifications</span>
                        <label class="switch">
                            <input type="checkbox" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <!-- Danger Zone -->
                <div class="settings-card danger-zone">
                    <h3><i class="fas fa-exclamation-triangle"></i> Danger Zone</h3>

                    <p>Be careful with these actions</p>

                    <button class="danger-btn">
                        <i class="fas fa-trash"></i> Delete Account
                    </button>
                </div>

            </div>

        </div>
    </div>
            
        </div>
<script>
        // Hamburger menu toggle for mobile
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebar = document.getElementById('sidebar');

        hamburgerBtn.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        // Close sidebar when clicking on a menu item (mobile)
        const sidebarLinks = document.querySelectorAll('.sidebar-menu-link');
        sidebarLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    sidebar.classList.remove('active');
                }
            });
        });

        // Close sidebar when clicking outside of it (mobile)
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && !hamburgerBtn.contains(e.target)) {
                    sidebar.classList.remove('active');
                }
            }
        });

        // Add smooth scroll behavior
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        const menuLinks = document.querySelectorAll('.sidebar-menu-link');

        menuLinks.forEach(link => {
            link.addEventListener('click', function () {
                // Remove active from all
                menuLinks.forEach(item => item.classList.remove('active'));

                // Add active to clicked one
                this.classList.add('active');
            });
        });
    </script>
        
</body>

</html>
