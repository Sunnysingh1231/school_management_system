<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insert title here</title>

<!-- Google Fonts -->
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
	rel="stylesheet">

<!-- Font Awesome Icons -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="@{/student/dashboard.css}">
<link rel="stylesheet" href="@{/student/sidebar.css}">
</head>
<body>
	<div class="dashboard-container">

		<div th:replace="~{/student/sidebar::sidebar}"> </div>

		<div class="main-content">
			<nav class="navbar">
				<div class="navbar-left">
					<button class="hamburger-menu" id="hamburgerBtn">
						<i class="fas fa-bars"></i>
					</button>

				</div>
				<div class="navbar-right">
					<button class="navbar-icon-btn">
						<i class="fas fa-bell"></i> <span class="notification-badge">3</span>
					</button>
					<button class="navbar-icon-btn">
						<i class="fas fa-envelope"></i>
					</button>
					<div class="user-profile">
						<div class="user-avatar"
							th:text="${#strings.substring(student.name,0,1).toUpperCase() + 
              (student.name.contains(' ') ? 
              #strings.substring(student.name, student.name.indexOf(' ')+1, student.name.indexOf(' ')+2).toUpperCase() 
              : '')}">
						</div>
						<div class="user-info">
							<p th:text="${student.name}">Arjun Joshi</p>
							<p
								th:text="${student.classEntity.className+' ('+student.classEntity.section+')'}"></p>
						</div>

					</div>
				</div>
			</nav>

			<div th:replace="~{/student/dashboard::dashboard}"></div>
		</div>

	</div>
	<script th:src="@{/student_js/index.js}"></script>
</body>
</html>
