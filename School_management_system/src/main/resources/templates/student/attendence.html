<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard - School Management System</title>

<!-- Google Fonts -->
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
	rel="stylesheet">

<!-- Font Awesome Icons -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- External CSS -->
<link rel="stylesheet" th:href="@{/student/dashboard.css}">
</head>

<body>
	<div class="overlay" id="overlay"></div>

	<div class="dashboard-container">

		<div th:replace="~{/student/sidebar::sidebar}"></div>



		<!-- ==================== Main Content ==================== -->
		<div class="main-content">
			<!-- ==================== Top Navbar ==================== -->
			<div th:replace="~{/student/navbar::navbar}"></div>


			<div class="dashboard-content">

				<!-- Page Header -->
				<div class="page-header">
					<h1>Attendance</h1>
					<p>Your class attendance overview</p>
				</div>

				<!-- Summary Cards -->
				<div class="summary-section">

					<div class="summary-card">
						<div class="summary-card-header">
							<span class="summary-card-title">Attendance %</span>
							<div class="summary-card-icon icon-attendance">
								<i class="fas fa-chart-line"></i>
							</div>
						</div>
						<div class="summary-card-value"
							th:text="${attendancePercent + '%'}">83%</div>

						<span class="status-badge"
							th:classappend="${attendancePercent >= 75} ? 'badge-success' : 'badge-warning'">
							<span
							th:text="${attendancePercent >= 75 ? 'Excellent' : 'Need Improvement'}"></span>
						</span>
					</div>

					<div class="summary-card">
						<div class="summary-card-header">
							<span class="summary-card-title">Total Classes</span>
							<div class="summary-card-icon icon-attendance">
								<i class="fas fa-calendar"></i>
							</div>
						</div>
						<div class="summary-card-value" th:text="${totalDays}">30</div>
						<div class="summary-card-footer">Overall classes conducted</div>
					</div>

					<div class="summary-card">
						<div class="summary-card-header">
							<span class="summary-card-title">Present</span>
							<div class="summary-card-icon icon-attendance">
								<i class="fas fa-check"></i>
							</div>
						</div>
						<div class="summary-card-value" th:text="${presentDays}">25</div>
					</div>

					<div class="summary-card">
						<div class="summary-card-header">
							<span class="summary-card-title">Absent</span>
							<div class="summary-card-icon icon-attendance">
								<i class="fas fa-times"></i>
							</div>
						</div>
						<div class="summary-card-value" th:text="${absentDays}">5</div>
					</div>


				</div>

				
				<!-- Attendance Table -->
				<div class="timetable-container">
					<h2 class="section-title">
						<i class="fas fa-list"></i> Attendance Records
					</h2>

					<table class="timetable">
						<thead>
							<tr>
								<th>Date</th>
								<th>Days</th>
								<th>Status</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="att : ${attendence6list}">
								<td th:text="${att.date}">2026-04-10</td>
								<td th:text="${#temporals.format(att.date, 'EEEE')}"></td>
								<td><span class="status-badge"
									th:classappend="${att.status == 'PRESENT'} ? 'badge-success' : 'badge-danger'"
									th:text="${att.status}"> Present </span></td>
							</tr>
						</tbody>
					</table>
					<div class="assignments-list"
						th:if="${#lists.isEmpty(attendence6list)}"
						style="text-align: center;">
						<div>
							<p>No Attendence available.</p>
						</div>
					</div>
				</div>

			</div>

		</div>
	</div>
	<script th:src="@{/student_js/index.js}"></script>
</body>

</html>
