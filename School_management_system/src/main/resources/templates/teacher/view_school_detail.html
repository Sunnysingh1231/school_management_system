<div th:fragment="aaa">


	<div class="top-header">
		<div>
			<h2>Student List</h2>
		</div>

		<div style="display: flex; gap: 10px;">
			<input type="text" id="searchInput" placeholder="Search student..."
				style="padding: 10px 15px; border-radius: 10px; border: 1px solid #e2e8f0; outline: none;">

			<button type="button" class="btn-primary" onclick="history.back()">
				← Back</button>
		</div>
	</div>

	<div class="table-container">
		<table id="studentTable">
			<thead>
				<tr>
					<th>S.No.</th>
					<th>Name</th>
					<th>Class</th>
					<th>Roll No</th>
					<th>Status</th>
					<th>Actions</th>
				</tr>
			</thead>

			
		</table>
	</div>

</div>
