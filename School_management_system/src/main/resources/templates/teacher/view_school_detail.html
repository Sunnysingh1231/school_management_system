<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SmS Super Admin</title>
    <link rel="stylesheet" th:href="@{/super_admin_css/header.css}">
	<style>
		
		.school-view{
			display:flex;
			justify-content:center;
			padding:40px;
		}
		
		.school-view-card{
			background:white;
			padding:30px;
			width:420px;
			border-radius:15px;
			box-shadow:0 5px 15px rgba(0,0,0,0.2);
		}
		
		.school-view-card h2{
			text-align:center;
			color:#ff758c;
			margin-bottom:0px;
		}
		
		.detail{
			display:flex;
			justify-content:space-between;
			margin-bottom:1px;
			border-bottom:1px solid #eee;
			padding-bottom:5px;
			align-items: center;
		}
		
		.detail span{
			font-weight:bold;
		}
		
		.actions{
			margin-top:20px;
			display:flex;
			justify-content:space-between;
		}
		
		.btn{
			padding:10px 18px;
			border-radius:20px;
			text-decoration:none;
			font-weight:bold;
		}
		
		.edit{
			background:#ffcc00;
			color:black;
		}
		
		.back{
			background:#4ecdc4;
			color:white;
		}
	
	</style>
</head>
<body>

	<!-- navbar -->
    <nav class="navbar">

        <div class="logo">SmS</div>
        <!-- Navigation Links -->
        <div class="nav-buttons" id="nav-links">
            <div class="auth-links">
                <a th:href="@{/super/schools}" class="btn">Back</a>
            </div>
        </div>
    </nav>
	
	
	<section class="school-view">
	
		<div class="school-view-card">
		
			<h2>School Details</h2>
			
			<div class="detail">
				<span>School Name:</span>
				<p th:text="${school.name}"></p>
			</div>
			
			<div class="detail">
				<span>Email:</span>
				<p th:text="${school.email}"></p>
			</div>
			
			<div class="detail">
				<span>Phone:</span>
				<p th:text="${school.phone}"></p>
			</div>
			
			<div class="detail">
				<span>Address:</span>
				<p th:text="${school.address}"></p>
			</div>
			
			<div class="detail">
				<span>City:</span>
				<p th:text="${school.city}"></p>
			</div>
			
			<div class="detail">
				<span>State:</span>
				<p th:text="${school.state}"></p>
			</div>
			
			<div class="detail">
				<span>Pincode:</span>
				<p th:text="${school.pincode}"></p>
			</div>
			
			<div class="actions">
			
				<a th:href="@{/super-admin/edit-school/{id}(id=${school.id})}" class="btn edit">Edit</a>
				
				<a th:href="@{/super/schools}" class="btn back">Back</a>
				
			</div>
		
		</div>
	
	</section>
	
</body>
</html>
