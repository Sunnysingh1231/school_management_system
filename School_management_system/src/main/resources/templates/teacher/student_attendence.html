<div th:fragment="attendence">



        <form id = "updateAttendence" th:action="@{/teacher/students-attendence}" method="post" onsubmit="return attendenceForm(event)">

            <!-- Header -->
        
        <div class="top-header">
				<div>
					<h2>📅 Mark Attendance</h2>
				</div>

				<div style="display: flex; gap: 10px;">
					<div class="header-actions">
						<button class="btn-primary">Save Attendance</button>
						<button type = "button" onclick="history.back()" class="btn-primary">
					<i class="fas fa-arrow-left"></i> Back
				</button>
					</div>

				</div>
			</div>

        <!-- Card -->
        <div class="glass-card">

            <table>
                <thead>
                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>

                    <!-- Row 1 -->
                    <tr th:each="student,count : ${students}">
                        <td th:text="${student.rollNumber}">101</td>
                        <td th:text="${student.name}">Amit Kumar</td>
                        <td class="cont">
                            <span class="status-text"></span>

                            <label class="switch">
                                <input type="checkbox" name="attends" th:value="${student.id}" onchange="toggleText(this)" th:checked="${allAttendence[student.id]}">
                                <span class="slider"></span>
                            </label>
                        </td>
                    </tr>

                </tbody>
            </table>

        </div>

        </form>

    </div>
 
</div>
