<div th:fragment="pay">
	<div class="main-area">

		<!-- Header -->
		<form id="feeForm" th:action="@{/teacher/student/fees/payment}"
			method="post" onsubmit="return validateFeeForm(event)">
			
			<input type="hidden" name="studentId" th:value="${student.id}">

			<div class="top-header">
				<h2>💰 Student Fee Payment</h2>

			</div>

			<!-- Student Info -->
			<div class="stats-row">
				<div class="stat-pill">
					Student: <span th:text="${student.name}"></span>
				</div>
				<div class="stat-pill">
					Class: <span
						th:text="${student.classEntity.className+'-'+student.classEntity.section}"></span>
				</div>
				<div class="stat-pill">
					Session: <span th:text="${sess}"></span>
				</div>
			</div>

			<!-- Fee Table -->
			<div class="glass-card">

				<table>
					<thead>
						<tr>
							<th>Month</th>
							<th>Amount</th>
							<th>Status</th>
							<th style="text-align: right;">Select</th>
						</tr>
					</thead>

					<tbody>
						<tr th:each="fee : ${feeDetail}">

							<!-- Month -->
							<td th:text="${fee.month}"></td>

							<!-- Amount -->
							<td>₹<span th:text="${fee.amount}"></span></td>

							<!-- Status -->
							<td>
								<span
									th:class="${fee.status == 'PAID'} ? 'badge' : 'badge red'"
									th:text="${fee.status}">
								</span>
							</td>

							<!-- Checkbox -->
							<td style="text-align: right;">
								<input type="checkbox"
								class="fee-check"
								name="feeIds"
								th:value="${fee.month}"
								th:data-amount="${fee.amount}"
								th:disabled="${fee.status == 'PAID'}"
								onchange="updateTotal()"
							>
							</td>

						</tr>
					</tbody>
				</table>

				<!-- Total Section -->
				<div
					style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;">

					<h3>
						Total Selected: ₹<span id="total">0</span>
					</h3>

					<div style="display: flex; gap: 10px;">
						<button type="button" class="btn-outline" onclick="selectAll()">Select
							All</button>
						<button type="submit" class="btn-primary">Pay Selected</button>
					</div>

				</div>

			</div>

		</form>

	</div>

</div>
