<div th:fragment="pay">

	<div class="main-area">

        <!-- Header -->
        <form action="@{/teacher/pay-fees}" method="post">

            <div class="top-header">
                <h2>💰 Student Fee Payment</h2>

                <div style="display:flex; gap:10px;">
                    <button type="button" class="btn-outline" onclick="selectAll()">Select All</button>
                    <button type="submit" class="btn-primary">Pay Selected</button>
                </div>
            </div>

            <!-- Student Info -->
            <div class="stats-row">
                <div class="stat-pill">
                    Student: <span text="${student.name}"></span>
                </div>
                <div class="stat-pill">
                    Class: <span text="${student.className}"></span>
                </div>
                <div class="stat-pill">
                    Session: <span text="${session}"></span>
                </div>
            </div>

            <!-- Fee Table -->
            <div class="glass-card">

                <table>
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th style="text-align:right;">Select</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr each="fee : ${fees}">

                            <!-- Month -->
                            <td text="${fee.month}"></td>

                            <!-- Amount -->
                            <td>₹<span text="${fee.amount}"></span></td>

                            <!-- Status -->
                            <td>
                                <span classappend="${fee.status == 'PAID'} ? 'badge' : 'badge red'"
                                      text="${fee.status}">
                                </span>
                            </td>

                            <!-- Checkbox -->
                            <td style="text-align:right;">
                                <input type="checkbox"
                                       class="fee-check"
                                       name="feeIds"
                                       value="${fee.id}"
                                       disabled="${fee.status == 'PAID'}"
                                       data-amount="${fee.amount}"
                                       onchange="updateTotal()">
                            </td>

                        </tr>
                    </tbody>
                </table>

                <!-- Total Section -->
                <div style="margin-top:20px; display:flex; justify-content:space-between; align-items:center;">

                    <h3>Total Selected: ₹<span id="total">0</span></h3>

                    <div style="display:flex; gap:10px;">
                        <button type="button" class="btn-outline" onclick="selectAll()">Select All</button>
                        <button type="submit" class="btn-primary">Pay Selected</button>
                    </div>

                </div>

            </div>

        </form>

    </div>


</div>
